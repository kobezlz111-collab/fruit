<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF8FA" />
  <meta name="description" content="轻账本 - 打开即用、10秒记一笔的个人财务记账工具，数据只存在你的浏览器里。" />
  <title>轻账本 · 记账</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23FF6F91'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E¥%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app">
    <!-- 页面容器：内容由 ui.js 动态渲染 -->
    <main class="pages">
      <section class="page active" id="page-home" aria-label="记账"></section>
      <section class="page" id="page-flow" aria-label="流水"></section>
      <section class="page" id="page-stats" aria-label="统计"></section>
      <section class="page" id="page-mine" aria-label="我的"></section>
    </main>

    <!-- 底部导航 -->
    <nav class="tabbar" aria-label="主导航">
      <button class="tab active" data-tab="home" type="button">
        <span class="tab-icon">📝</span>
        <span class="tab-label">记账</span>
      </button>
      <button class="tab" data-tab="flow" type="button">
        <span class="tab-icon">🧾</span>
        <span class="tab-label">流水</span>
      </button>
      <button class="tab" data-tab="stats" type="button">
        <span class="tab-icon">📊</span>
        <span class="tab-label">统计</span>
      </button>
      <button class="tab" data-tab="mine" type="button">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <!-- 遮罩层 -->
  <div class="overlay" id="overlay" hidden></div>

  <!-- 底部弹层（分类/账户/日期/账单编辑等） -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

  <!-- 居中对话框（确认删除等） -->
  <div class="modal" id="modal" role="alertdialog" aria-modal="true" hidden></div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/db.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
